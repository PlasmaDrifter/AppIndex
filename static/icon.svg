<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4261"/>
      <stop offset="100%" stop-color="#1e2030"/>
    </linearGradient>
    <linearGradient id="tileGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8aadf4"/>
      <stop offset="100%" stop-color="#7dc4e4"/>
    </linearGradient>
    <linearGradient id="tileGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6da95"/>
      <stop offset="100%" stop-color="#8bd5ca"/>
    </linearGradient>
    <linearGradient id="tileGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a97f"/>
      <stop offset="100%" stop-color="#eed49f"/>
    </linearGradient>
    <linearGradient id="tileGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c6a0f6"/>
      <stop offset="100%" stop-color="#f5bde6"/>
    </linearGradient>
  </defs>

  <!-- Base background plate -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#363a4f" stroke-width="2"/>

  <!-- Four app tiles -->
  <rect x="10" y="10" width="18" height="18" rx="5" fill="url(#tileGrad1)"/>
  <rect x="36" y="10" width="18" height="18" rx="5" fill="url(#tileGrad2)"/>
  <rect x="10" y="36" width="18" height="18" rx="5" fill="url(#tileGrad3)"/>
  <rect x="36" y="36" width="18" height="18" rx="5" fill="url(#tileGrad4)"/>

  <!-- Center inspection magnifying badge -->
  <circle cx="32" cy="32" r="11" fill="#181926" stroke="#8aadf4" stroke-width="2.5"/>
  <circle cx="30" cy="30" r="4.5" fill="none" stroke="#cad3f5" stroke-width="1.8"/>
  <line x1="33.5" y1="33.5" x2="37" y2="37" stroke="#cad3f5" stroke-width="2" stroke-linecap="round"/>
</svg>
