  <path d="M72 27 C72 21 76 19 83 19 L96 19 C103 19 107 21 107 27" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.35"/>
  <path d="M21 78 C21 72 25 70 32 70 L45 70 C52 70 56 72 56 78" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.35"/>
  <path d="M72 78 C72 72 76 70 83 70 L96 70 C103 70 107 72 107 78" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.35"/>
